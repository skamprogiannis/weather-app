<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="humidity-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#57a0ee;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#4361ee;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  <g transform="translate(32, 32)">
    <!-- Water Drop -->
    <path d="M0,16 C8,16 14,10 14,2 C14,-10 0,-16 0,-16 C0,-16 -14,-10 -14,2 C-14,10 -8,16 0,16 Z" 
      fill="url(#humidity-grad)">
      <animate attributeName="d" 
        values="M0,16 C8,16 14,10 14,2 C14,-10 0,-16 0,-16 C0,-16 -14,-10 -14,2 C-14,10 -8,16 0,16 Z;
               M0,16 C7,16 13,10 13,2 C13,-9 0,-15 0,-15 C0,-15 -13,-9 -13,2 C-13,10 -7,16 0,16 Z;
               M0,16 C8,16 14,10 14,2 C14,-10 0,-16 0,-16 C0,-16 -14,-10 -14,2 C-14,10 -8,16 0,16 Z" 
        dur="3s" 
        repeatCount="indefinite" />
    </path>
    
    <!-- Small drip at bottom -->
    <circle cx="0" cy="15" r="1.5" fill="#57a0ee" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="cy" values="15;20;25" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="r" values="1.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>
</svg>