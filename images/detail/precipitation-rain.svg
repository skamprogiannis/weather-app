<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cloud-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dee2e6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="drop-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#57a0ee;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4361ee;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  <g transform="translate(32, 32)">
    <!-- Cloud -->
    <path d="M12,-12 C12,-19 5,-24 -3,-24 C-11,-24 -18,-19 -18,-12 C-18,-12 -18,-12 -18,-12 C-22,-12 -24,-10 -24,-6 C-24,-2 -21,0 -18,0 L12,0 C15,0 18,-2 18,-6 C18,-10 15,-12 12,-12 Z" fill="url(#cloud-fill)" />
    
    <!-- Left Raindrop -->
    <line x1="-14" y1="4" x2="-14" y2="14" stroke="#57a0ee" stroke-width="2" stroke-linecap="round">
      <animate attributeName="y1" values="4;14" dur="1s" repeatCount="indefinite" />
      <animate attributeName="y2" values="14;24" dur="1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" />
    </line>
    
    <!-- Middle-Left Raindrop -->
    <line x1="-7" y1="2" x2="-7" y2="12" stroke="#57a0ee" stroke-width="2" stroke-linecap="round">
      <animate attributeName="y1" values="2;12" dur="1.2s" repeatCount="indefinite" begin="0.2s" />
      <animate attributeName="y2" values="12;22" dur="1.2s" repeatCount="indefinite" begin="0.2s" />
      <animate attributeName="opacity" values="1;0" dur="1.2s" repeatCount="indefinite" begin="0.2s" />
    </line>
    
    <!-- Center Raindrop -->
    <line x1="0" y1="5" x2="0" y2="15" stroke="#57a0ee" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="y1" values="5;15" dur="0.8s" repeatCount="indefinite" begin="0.4s" />
      <animate attributeName="y2" values="15;25" dur="0.8s" repeatCount="indefinite" begin="0.4s" />
      <animate attributeName="opacity" values="1;0" dur="0.8s" repeatCount="indefinite" begin="0.4s" />
    </line>
    
    <!-- Middle-Right Raindrop -->
    <line x1="7" y1="3" x2="7" y2="13" stroke="#57a0ee" stroke-width="2" stroke-linecap="round">
      <animate attributeName="y1" values="3;13" dur="1.1s" repeatCount="indefinite" begin="0.3s" />
      <animate attributeName="y2" values="13;23" dur="1.1s" repeatCount="indefinite" begin="0.3s" />
      <animate attributeName="opacity" values="1;0" dur="1.1s" repeatCount="indefinite" begin="0.3s" />
    </line>
    
    <!-- Right Raindrop -->
    <line x1="14" y1="2" x2="14" y2="12" stroke="#57a0ee" stroke-width="2" stroke-linecap="round">
      <animate attributeName="y1" values="2;12" dur="1s" repeatCount="indefinite" begin="0.5s" />
      <animate attributeName="y2" values="12;22" dur="1s" repeatCount="indefinite" begin="0.5s" />
      <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" begin="0.5s" />
    </line>
  </g>
</svg>