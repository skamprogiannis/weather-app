<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="thermGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ef476f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ef476f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ced4da;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ced4da;stop-opacity:1" />
    </linearGradient>
  </defs>
  <g transform="translate(32, 32)">
    <!-- Thermometer tube -->
    <rect x="-3" y="-22" width="6" height="32" rx="3" ry="3" fill="#ced4da" stroke="#adb5bd" stroke-width="1" />
    <!-- Mercury -->
    <rect x="-3" y="-4" width="6" height="14" rx="3" ry="3" fill="#ef476f">
      <animate attributeName="height" values="14;16;14" dur="2s" repeatCount="indefinite" />
      <animate attributeName="y" values="-4;-6;-4" dur="2s" repeatCount="indefinite" />
    </rect>
    <!-- Thermometer bulb -->
    <circle cx="0" cy="10" r="8" fill="url(#thermGrad)" stroke="#adb5bd" stroke-width="1" />
    <circle cx="0" cy="10" r="5" fill="#ef476f" />
    <!-- Temperature marks -->
    <line x1="3" y1="-18" x2="7" y2="-18" stroke="#adb5bd" stroke-width="1.5" />
    <line x1="3" y1="-10" x2="5" y2="-10" stroke="#adb5bd" stroke-width="1" />
    <line x1="3" y1="-2" x2="7" y2="-2" stroke="#adb5bd" stroke-width="1.5" />
  </g>
</svg>